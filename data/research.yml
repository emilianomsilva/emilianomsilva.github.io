- id: "mercury-free-extraction"
  title_en: "Mercury-Free Gold Extraction & Alternative Lixiviants"
  title_pt: "Processamento de Ouro Sem Mercúrio e Lixiviantes Alternativos"
  title_es: "Procesamiento de Oro Sin Mercurio y Lixiviantes Alternativos"
  desc_en: "System-wide diagnostics of amalgamation/cyanidation circuits, evaluation of mercury losses, and development of cleaner leaching routes using agro-industrial waste (such as cassava wastewater)."
  desc_pt: "Diagnóstico sistêmico de circuitos de amalgamação e cianetação, avaliação de perdas de mercúrio e desenvolvimento de rotas limpas utilizando resíduos agroindustriais (como manipueira)."
  desc_es: "Diagnóstico sistémico de circuitos de amalgamación y cianuración, evaluación de pérdidas de mercurio y desarrollo de rutas limpias utilizando residuos agroindustriales (como aguas residuales de yuca)."

- id: "tailings-circular-economy"
  title_en: "Tailings Valorization & Circular Economy"
  title_pt: "Economia Circular e Valorização de Rejeitos Minerais"
  title_es: "Economía Circular y Valorización de Relaves Mineros"
  desc_en: "Reprocessing and conversion of ASGM tailings into structural materials (cement-tailings bricks) and conceptual micro-enterprise models for sustainable waste management."
  desc_pt: "Reprocessamento e conversão de rejeitos de mineração artesanal em materiais estruturais (tijolos de cimento e rejeito) e modelos de microempresas sustentáveis."
  desc_es: "Reprocesamiento y conversión de relaves mineros artesanales en materiales estructurales (ladrillos de cemento y relaves) y modelos de microempresas sostenibles."

- id: "field-diagnostics-process-eng"
  title_en: "Field Metallurgical Diagnostics & Process Engineering"
  title_pt: "Diagnóstico Metalúrgico de Campo e Engenharia de Processos"
  title_es: "Diagnóstico Metalúrgico de Campo e Ingeniería de Procesos"
  desc_en: "Environmental sampling, technical diagnostics, and field assessment conducted across artisanal gold mining operations in Brazil, Suriname, and Colombia."
  desc_pt: "Amostragem ambiental, diagnósticos técnicos e avaliação de campo realizados em operações de mineração artesanal no Brasil, Suriname e Colômbia."
  desc_es: "Muestreo ambiental, diagnósticos técnicos y evaluación de campo realizados en operaciones de minería artesanal en Brasil, Surinam y Colombia."
