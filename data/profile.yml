summary_en: "Forensic Expert and Sustainable Mining Researcher with over 10 years of experience bridging field investigations with scientific analysis. Expert in applying forensic methodologies to ensure technical integrity in both criminal justice and mining sectors. Chemist, Civil Engineer, and Ph.D. candidate in Mining Engineering at the University of São Paulo (USP) with interdisciplinary expertise in hydrometallurgy, mineral processing, analytical chemistry, environmental geochemistry, and sustainable extractive metallurgy. Research focuses on mercury-free gold extraction, alternative leaching technologies (such as cassava wastewater lixiviants), metallurgical process optimization, and mine waste valorization (such as cement-tailings bricks)."
summary_pt: "Perito Oficial Criminal e Pesquisador em Mineração Sustentável com mais de 10 anos de experiência unindo investigações de campo à análise científica. Químico, Engenheiro Civil e Doutorando em Engenharia Mineral na Universidade de São Paulo (USP) com expertise interdisciplinar em hidrometalurgia, tratamento de minérios, química analítica, geoquímica ambiental e metalurgia extrativa sustentável. Sua pesquisa foca em extração de ouro sem mercúrio, tecnologias de lixiviação alternativas (como lixiviantes à base de manipueira), otimização de processos metalúrgicos e valorização de rejeitos minerais (como tijolos de cimento e rejeito)."
summary_es: "Perito Oficial Criminal e Investigador en Minería Sostenible con más de 10 años de experiencia uniendo investigaciones de campo con el análisis científico. Químico, Ingeniero Civil y Doctorando en Ingeniería Mineral en la Universidad de São Paulo (USP) con experiencia interdisciplinaria en hidrometalurgia, procesamiento de minerales, química analítica, geoquímica ambiental y metalurgia extractiva sostenible. Su investigación se centra en la extracción de oro sin mercurio, tecnologías de lixiviación alternativas (como lixiviantes a base de aguas residuales de yuca), optimización de procesos metalúrgicos y valorización de residuos mineros (como ladrillos de cemento y relaves)."
