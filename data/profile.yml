summary_en: "Interdisciplinary researcher with 15+ years of experience across chemistry, environmental geosciences, mining and construction engineering, and forensic science. Currently a Ph.D. Candidate in Mineral Engineering at the University of São Paulo, investigating sustainable approaches to mineral processing, mercury-free gold recovery, and mine-waste valorization."
summary_pt: "Pesquisador interdisciplinar com mais de 15 anos de experiência nas áreas de química, geociências ambientais, engenharia de minas e civil e ciências forenses. Atualmente, é Doutorando em Engenharia Mineral na Universidade de São Paulo, investigando abordagens sustentáveis para o processamento mineral, a recuperação de ouro sem mercúrio e a valorização de rejeitos de mineração."
summary_es: "Investigador interdisciplinario con más de 15 años de experiencia en química, geociencias ambientales, ingeniería minera y civil, y ciencias forenses. Actualmente es Doctorando en Ingeniería Mineral en la Universidad de São Paulo, investigando enfoques sostenibles para el procesamiento de minerales, la recuperación de oro sin mercurio y la valorización de relaves mineros."
