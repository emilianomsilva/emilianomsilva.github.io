competencies:
  - category_en: "STEM & Technical Competencies"
    category_pt: "Competências em STEM e Química Analítica"
    category_es: "Competencias en STEM y Química Analítica"
    items:
      - name_en: "Field Operations & Sampling"
        name_pt: "Operações e Amostragem de Campo"
        name_es: "Operaciones y Muestreo de Campo"
        years: "15+ yrs"
        details_en: "Expert forensic and environmental sampling in mining operations and complex crime scenes."
        details_pt: "Amostragem ambiental e pericial em operações minerárias e cenas de crime complexas."
        details_es: "Muestreo ambiental y forense en operaciones mineras y escenas de crimen complejas."

      - name_en: "Analytical Chemistry"
        name_pt: "Química Analítica & Geoquímica"
        name_es: "Química Analítica y Geoquímica"
        years: "15+ yrs"
        details_en: "Environmental monitoring of trace elements (mercury, selenium) and analytical quality control."
        details_pt: "Monitoramento ambiental de elementos traço (mercúrio, selênio) e controle de qualidade analítico."
        details_es: "Monitoreo ambiental de elementos traza (mercurio, selenio) y control de calidad analítico."

      - name_en: "Technical Reporting"
        name_pt: "Laudos e Documentação Técnica"
        name_es: "Informes y Documentación Técnica"
        years: "12+ yrs"
        details_en: "Preparation of judicial forensic reports, technical opinions, and high-impact scientific papers."
        details_pt: "Elaboração de laudos periciais judiciais, pareceres técnicos e artigos científicos de alto impacto."
        details_es: "Elaboración de informes periciales judiciales, dictámenes técnicos y artículos científicos."

      - name_en: "Data Analysis & Modeling"
        name_pt: "Análise de Dados e Modelagem"
        name_es: "Análisis de Datos y Modelado"
        years: "12+ yrs"
        details_en: "Statistical modeling of geochemical datasets using Excel, R, and Python."
        details_pt: "Modelagem estatística de dados geoquímicos e ambientais utilizando Excel, R e Python."
        details_es: "Modelado estadístico de datos geoquímicos y ambientales utilizando Excel, R y Python."

      - name_en: "AI-Assisted Development"
        name_pt: "Desenvolvimento Assistido por IA"
        name_es: "Desarrollo Asistido por IA"
        years: "2+ yrs"
        details_en: "Rapid prototyping, data automation, and scientific code workflows."
        details_pt: "Prototipagem rápida, automação de dados e fluxos computacionais científicos."
        details_es: "Prototipado rápido, automatización de datos y flujos computacionales científicos."

  - category_en: "Leadership & Operational Management"
    category_pt: "Liderança e Gestão Operacional"
    category_es: "Liderazgo y Gestión Operativa"
    items:
      - name_en: "Regional Unit Management"
        name_pt: "Gestão de Unidades Regionais"
        name_es: "Gestión de Unidades Regionales"
        years: "10+ yrs"
        details_en: "Command of official forensic operations (POLITEC), evidence custody, and judicial liaison."
        details_pt: "Comando de operações periciais da POLITEC, custódia de evidências e articulação judicial."
        details_es: "Mando de operaciones periciales de POLITEC, custodia de evidencias y articulación judicial."

      - name_en: "Construction Management"
        name_pt: "Gestão de Obras e Recursos"
        name_es: "Gestión de Obras y Recursos"
        years: "3+ yrs"
        details_en: "Field execution, resource optimization, and cost control in Civil Engineering projects."
        details_pt: "Direção de execução, eficiência orçamentária e gestão de insumos na Engenharia Civil."
        details_es: "Dirección de ejecución, eficiencia presupuestaria y gestión de insumos en Ingeniería Civil."

