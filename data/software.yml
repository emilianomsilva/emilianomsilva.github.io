  purpose_es: "Herramientas de diagnóstico de ingeniería y optimización de procesos diseñadas para la minería artesanal sostenible."
  stack: ["Rust", "WebAssembly", "Open Science"]
  license: "MIT"
  repo: "https://github.com/emilianomsilva/asgm-toolkit"

