- period: "2010–2012"
  degree_en: "M.Sc. in Geosciences"
  degree_pt: "Mestrado em Geociências"
  degree_es: "Maestría en Geociencias"
  institution: "Federal University of Mato Grosso (UFMT), Brazil"
  details_en: "Dissertation utilized exploratory data analysis to evaluate surface water quality as a geochemical indicator of selenium leaching in mining environments. Includes international research fellowship at the University of British Columbia (UBC), Canada, funded by the Emerging Leaders in the Americas Program (ELAP)."
  details_pt: "Dissertação utilizou análise exploratória de dados para avaliar a qualidade da água superficial como indicador geoquímico de lixiviação de selênio. Incluiu bolsa de pesquisa internacional na University of British Columbia (UBC), Canadá (ELAP)."
  details_es: "La tesis utilizó análisis exploratorio de datos para evaluar la calidad del agua superficial como indicador geoquímico de lixiviación de selenio. Incluyó beca de investigación internacional en la University of British Columbia (UBC), Canadá (ELAP)."

- period: "2005–2009"
  degree_en: "B.Sc. in Chemistry"
  degree_pt: "Bacharelado em Química"
  degree_es: "Licenciatura en Química"
  institution: "Federal University of Mato Grosso (UFMT), Brazil"
  details_en: "Undergraduate research focused on analytical chemistry and the continuous monitoring of mercury levels in regional ecosystems. Technical experience at the University's Fuel Analytical Center."
  details_pt: "Pesquisa de graduação focada em química analítica e monitoramento contínuo de níveis de mercúrio em ecossistemas regionais. Experiência técnica no Centro de Análise de Combustíveis da universidade."
  details_es: "Investigación de grado centrada en química analítica y monitoreo continuo de niveles de mercurio en ecosistemas regionales. Experiencia técnica en el Centro de Análisis de Combustibles de la universidad."
