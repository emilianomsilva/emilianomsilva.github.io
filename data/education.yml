- period: "2023–Present"
  degree_en: "Ph.D. in Mineral Engineering"
  degree_pt: "Doutorado em Engenharia Mineral"
  degree_es: "Doctorado en Ingeniería Mineral"
  institution: "University of São Paulo (USP), São Paulo, Brazil"
  details_en: "Developing sustainable processing pathways for Artisanal Gold Mining (AGM) by replacing mercury with cleaner alternative technologies. The research focuses on field investigations and technical diagnostics of gold recovery and operational conditions in cleaner mineral processing."
  details_pt: "Desenvolvimento de rotas de processamento sustentáveis para a Mineração Artesanal de Ouro (AGM), substituindo o mercúrio por tecnologias alternativas limpas. Foco em investigações de campo e diagnósticos técnicos da recuperação de ouro e das condições operacionais em processamento mineral mais limpo."
  details_es: "Desarrollo de rutas de procesamiento sostenibles para la Minería Artesanal de Oro (AGM), reemplazando el mercurio con tecnologías alternativas más limpias. Enfoque en investigaciones de campo y diagnósticos técnicos de la recuperación de oro y las condiciones operativas en un procesamiento mineral más limpio."

