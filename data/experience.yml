research:
  - period: "2023–Present"
    role_en: "Researcher"
    role_pt: "Pesquisador"
    role_es: "Investigador"
    organization: "NAP.Mineração, Research Center for Responsible Mining, University of São Paulo, Brazil"
    details_en: "Conduct research on sustainable artisanal and small-scale gold mining in Brazil, Colombia, and Suriname. Perform field diagnostics, environmental and process sampling, and data analysis to assess gold recovery, mercury losses, and resource efficiency. Contribute to mercury-free processing strategies and mine-waste valorization pathways."
    details_pt: "Realiza pesquisa sobre mineração de ouro artesanal e de pequena escala sustentável no Brasil, Colômbia e Suriname. Executa diagnósticos de campo, amostragem ambiental e de processo e análise de dados para avaliar a recuperação de ouro, as perdas de mercúrio e a eficiência no uso de recursos. Contribui para estratégias de processamento sem mercúrio e valorização de rejeitos de mineração."
    details_es: "Realiza investigación sobre minería de oro artesanal y de pequeña escala sostenible en Brasil, Colombia y Surinam. Realiza diagnósticos de campo, muestreo ambiental y de proceso, y análisis de datos para evaluar la recuperación de oro, las pérdidas de mercurio y la eficiencia en el uso de recursos. Contribuye a estrategias de procesamiento sin mercurio y valorización de relaves mineros."

  - period: "2011"
    role_en: "Visiting Research Student"
    role_pt: "Estudante Pesquisador Visitante"
    role_es: "Estudiante Investigador Visitante"
    organization: "Norman B. Keevil Institute of Mining Engineering, University of British Columbia, Vancouver, Canada"
    details_en: "Conducted research in environmental geochemistry as an Emerging Leaders in the Americas Program scholarship recipient, supervised by Prof. Marcello Mariz da Veiga. Investigated water-quality parameters and selenium geochemistry in coal-mining environments."
    details_pt: "Realizou pesquisa em geoquímica ambiental como bolsista do Emerging Leaders in the Americas Program, sob supervisão do Prof. Marcello Mariz da Veiga. Investigou parâmetros de qualidade da água e a geoquímica do selênio em ambientes de mineração de carvão."
    details_es: "Realizó investigación en geoquímica ambiental como becario del Emerging Leaders in the Americas Program, bajo la supervisión del Prof. Marcello Mariz da Veiga. Investigó parámetros de calidad del agua y la geoquímica del selenio en entornos de minería de carbón."

  - period: "2011"
    role_en: "Junior Geochemist, Trainee"
    role_pt: "Geoquímico Júnior, Estagiário"
    role_es: "Geoquímico Júnior, Pasante"
    organization: "Lorax Environmental Services Ltd., Vancouver, Canada"
    details_en: "Contributed to the project Role of Nitrate in the Remobilization and Attenuation of Selenium in Coal Mine Waste, involving Lorax, the Mine Environment Neutral Drainage program, Natural Resources Canada, and industry partners. Analyzed surface-water and geochemical data from coal-mining operations."
    details_pt: "Contribuiu para o projeto Role of Nitrate in the Remobilization and Attenuation of Selenium in Coal Mine Waste, envolvendo a Lorax, o programa Mine Environment Neutral Drainage, a Natural Resources Canada e parceiros da indústria. Analisou dados de águas superficiais e geoquímicos de operações de mineração de carvão."
    details_es: "Contribuyó al proyecto Role of Nitrate in the Remobilization and Attenuation of Selenium in Coal Mine Waste, en colaboración con Lorax, el programa Mine Environment Neutral Drainage, Natural Resources Canada y socios industriales. Analizó datos de aguas superficiales y geoquímicos de operaciones de minería de carbón."

professional:
  - period: "2022–Present"
    role_en: "Construction Engineer"
    role_pt: "Engenheiro de Construção"
    role_es: "Ingeniero de Construcción"
    organization: "Independent Practice, Mato Grosso, Brazil"
    details_en: "Manage the field execution, budgeting, resource allocation, procurement, and quality control of more than ten residential construction projects. Coordinate construction teams and suppliers, control costs and material use, and deliver practical solutions under operational constraints."
    details_pt: "Gerencia a execução de campo, orçamento, alocação de recursos, compras e controle de qualidade de mais de dez projetos residenciais. Coordena equipes de construção e fornecedores, controla custos e uso de materiais e entrega soluções práticas sob restrições operacionais."
    details_es: "Gestiona la ejecución de campo, presupuestos, asignación de recursos, compras y control de calidad de más de diez proyectos residenciales. Coordina equipos de construcción y proveedores, controla costos y uso de materiales, y entrega soluciones prácticas bajo restricciones operativas."

  - period: "2014–Present"
    role_en: "Official Forensic Expert and Crime Scene Investigator"
    role_pt: "Perito Oficial Criminal e Investigador de Local de Crime"
    role_es: "Perito Oficial Forense e Investigador de Escena del Crimen"
    organization: "POLITEC, State Secretariat of Public Security, Mato Grosso, Brazil"
    details_en: "Conduct official forensic examinations and crime-scene investigations that support criminal-justice proceedings and public-safety decision-making. Apply rigorous procedures for evidence collection, documentation, analysis, and chain-of-custody control, and prepare technically defensible reports for legal proceedings. Previously served as Regional Manager for the Juína and Primavera do Leste units, coordinating operations and liaising with judicial and regulatory authorities."
    details_pt: "Realiza exames periciais oficiais e investigações de locais de crime que subsidiam processos de justiça criminal e decisões de segurança pública. Aplica procedimentos rigorosos de coleta, documentação e análise de evidências e controle da cadeia de custódia, elaborando laudos tecnicamente defensáveis para processos judiciais. Atuou como Gerente Regional das unidades de Juína e Primavera do Leste, coordenando operações e articulando-se com autoridades judiciais e regulatórias."
    details_es: "Realiza exámenes forenses oficiales e investigaciones de escenas del crimen que respaldan procesos de justicia penal y decisiones de seguridad pública. Aplica procedimientos rigurosos de recolección, documentación y análisis de evidencias y control de la cadena de custodia, y prepara informes técnicamente defendibles para procedimientos judiciales. Anteriormente se desempeñó como Gerente Regional de las unidades de Juína y Primavera do Leste, coordinando operaciones y articulándose con autoridades judiciales y regulatorias."

teaching:
  - period: "2017–2020"
    role_en: "Part-time Lecturer and Program Coordinator"
    role_pt: "Professor e Coordenador de Programa"
    role_es: "Profesor de Tiempo Parcial y Coordinador de Programa"
    organization: "Faculdade Poliensino, Mato Grosso, Brazil"
    details_en: "Coordinated and taught postgraduate specialization coursework in Criminalistics and Forensic Sciences, with emphasis on crime-scene processing and forensic investigative methodologies."
    details_pt: "Coordenou e lecionou disciplinas de especialização de pós-graduação em Criminalística e Ciências Forenses, com ênfase em processamento de locais de crime e metodologias de investigação forense."
    details_es: "Coordinó e impartió cursos de especialización de posgrado en Criminalística y Ciencias Forenses, con énfasis en procesamiento de escenas del crimen y metodologías de investigación forense."

  - period: "2012–2014"
    role_en: "Full-time Lecturer"
    role_pt: "Professor de Tempo Integral"
    role_es: "Profesor de Tiempo Completo"
    organization: "Centro Universitário de Várzea Grande (UNIVAG), Mato Grosso, Brazil"
    details_en: "Taught Statistics, Materials Science, General Chemistry, and Analytical Chemistry. Contributed to the institutional accreditation process for the Civil Engineering program."
    details_pt: "Lecionou Estatística, Ciência dos Materiais, Química Geral e Química Analítica. Contribuiu para o processo institucional de reconhecimento do curso de Engenharia Civil."
    details_es: "Impartió Estadística, Ciencia de Materiales, Química General y Química Analítica. Contribuyó al proceso institucional de acreditación del programa de Ingeniería Civil."

  - period: "2011–2014"
    role_en: "Guest Lecturer"
    role_pt: "Professor Convidado"
    role_es: "Profesor Invitado"
    organization: "State University of Mato Grosso (UNEMAT), Mato Grosso, Brazil"
    details_en: "Delivered classroom and laboratory modules in General and Analytical Chemistry for chemistry degree students."
    details_pt: "Ministrou módulos teóricos e laboratoriais de Química Geral e Química Analítica para estudantes de graduação em Química."
    details_es: "Impartió módulos teóricos y de laboratorio de Química General y Química Analítica para estudiantes de grado en Química."

  - period: "2010–2011"
    role_en: "Assistant Professor"
    role_pt: "Professor Assistente"
    role_es: "Profesor Auxiliar"
    organization: "Federal University of Mato Grosso (UFMT), Mato Grosso, Brazil"
    details_en: "Taught Applied Analytical Chemistry and General Chemistry for Civil, Sanitary, and Environmental Engineering programs. Managed laboratory sessions and supported student training in chemical-analysis methods."
    details_pt: "Lecionou Química Analítica Aplicada e Química Geral para cursos de Engenharia Civil, Sanitária e Ambiental. Gerenciou atividades laboratoriais e apoiou a formação de estudantes em métodos de análise química."
    details_es: "Impartió Química Analítica Aplicada y Química General para programas de Ingeniería Civil, Sanitaria y Ambiental. Gestionó sesiones de laboratorio y apoyó la formación de estudiantes en métodos de análisis químico."
