<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Params.bio_short | default .Site.Params.bio_short }}">
<meta name="author" content="{{ .Site.Params.author }}">

<!-- OpenGraph & SEO -->
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ .Params.bio_short | default .Site.Params.bio_short }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- SCSS Compiled Style -->
{{ $options := dict "targetPath" "css/style.css" "outputStyle" "compressed" }}
{{ $style := resources.Get "scss/main.scss" | toCSS $options | fingerprint }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">

<!-- Favicon Emoji -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

<!-- Detecção Inteligente de Idioma (Navegador + LocalStorage) -->
<script>
  (function() {
    var path = window.location.pathname;
    // Executa apenas se estiver acessando a raiz (ex: / ou /index.html)
    if (path === '/' || path === '/index.html' || path === '') {
      var savedLang = localStorage.getItem('user_lang');
      var targetLang = savedLang;

      if (!targetLang) {
        var userLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
        if (userLang.startsWith('pt')) {
          targetLang = 'pt';
        } else if (userLang.startsWith('es')) {
          targetLang = 'es';
        } else {
          targetLang = 'en';
        }
      }

      if (targetLang && (targetLang === 'pt' || targetLang === 'es' || targetLang === 'en')) {
        window.location.replace('/' + targetLang + '/');
      }
    }
  })();
</script>
