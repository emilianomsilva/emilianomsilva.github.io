    {{ $currentLang := .Language.Lang }}
    <div class="mobile-lang-dropdown">
      <button class="mobile-topbar-item mobile-lang-button" type="button" onclick="toggleMobileLang(event)" aria-haspopup="true" aria-expanded="false" aria-label="{{ i18n "language" }}">
        {{ upper $currentLang }}
      </button>
      <div class="mobile-lang-menu" role="menu">
        {{ range site.Languages }}
        <a href="/{{ .Lang }}/" class="mobile-lang-option{{ if eq .Lang $currentLang }} active{{ end }}" onclick="switchLangWithHash(event, '{{ .Lang }}')" role="menuitem">{{ upper .Lang }}</a>

      </div>
