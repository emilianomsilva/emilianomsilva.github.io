<!DOCTYPE html>
<html lang="{{ .Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "sidebar.html" . }}
  <main class="main-viewport">
    {{ partial "header.html" . }}
    <div class="scroll-container" id="scroll-area">
      {{ block "main" . }}{{ end }}
      {{ partial "footer.html" . }}
    </div>
  </main>

  <script>
    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('collapsed');
    }

    function setActiveSection(sectionId) {
      const activeItem = document.querySelector(`.menu-item[data-section="${sectionId}"]`);
      if (!activeItem) return;

      menuItems.forEach(item => item.classList.toggle('active', item === activeItem));
      const label = activeItem.querySelector('.menu-label');
      if (label && breadcrumbLabel) {
        breadcrumbLabel.innerText = label.innerText.toUpperCase();
      }
    }

    function scrollToSection(sectionId) {
      const section = document.getElementById(sectionId);
      if (section) {
        section.scrollIntoView({ behavior: 'smooth' });
      }
    }

    // Auto highlight active menu item on scroll
    const scrollArea = document.getElementById('scroll-area');
    const sections = document.querySelectorAll('.page-section');
    const menuItems = document.querySelectorAll('.menu-item');
    const breadcrumbLabel = document.getElementById('current-section-name');
    let lastActiveSectionId = '';
    let scrollFrame = null;

    function updateActiveSection() {
      scrollFrame = null;
      let currentSectionId = '';
      let closestDistance = Infinity;

      sections.forEach(section => {
        const sectionTop = section.offsetTop - scrollArea.offsetTop;
        const distance = scrollArea.scrollTop + 100 - sectionTop;
        if (distance >= 0 && distance < closestDistance) {
          closestDistance = distance;
          currentSectionId = section.id;
        }
      });

      if (!currentSectionId && sections.length) {
        currentSectionId = sections[0].id;
      }

      if (currentSectionId && currentSectionId !== lastActiveSectionId) {
        lastActiveSectionId = currentSectionId;
        setActiveSection(currentSectionId);
      }
    }

    if (scrollArea && sections.length > 0) {
      scrollArea.addEventListener('scroll', () => {
        if (!scrollFrame) {
          scrollFrame = requestAnimationFrame(updateActiveSection);
        }
      });
      updateActiveSection();
    }

    function switchLangWithHash(event, targetLang) {
      event.preventDefault();
      localStorage.setItem('user_lang', targetLang);
      var hash = lastActiveSectionId ? '#' + lastActiveSectionId : window.location.hash;
      window.location.href = '/' + targetLang + '/' + hash;
    }

    // Scroll to section from hash on load if present
    window.addEventListener('DOMContentLoaded', () => {
      if (window.location.hash) {
        var sectionId = window.location.hash.substring(1);
        setTimeout(() => scrollToSection(sectionId), 100);
      }
    });
  </script>
</body>
</html>
