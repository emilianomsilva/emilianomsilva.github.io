<!DOCTYPE html>
<html lang="{{ .Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "sidebar.html" . }}
  <main class="main-viewport">
    {{ partial "header.html" . }}
    <div class="scroll-container" id="scroll-area">
      {{ block "main" . }}{{ end }}
      {{ partial "footer.html" . }}
    </div>
  </main>

  <script>
    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('collapsed');
    }

    function scrollToSection(sectionId, menuEl) {
      const section = document.getElementById(sectionId);
      if (section) {
        section.scrollIntoView({ behavior: 'smooth' });
      }

      if (menuEl) {
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        menuEl.classList.add('active');
      }
    }

    // Auto highlight active menu item on scroll
    const scrollArea = document.getElementById('scroll-area');
    const sections = document.querySelectorAll('.page-section');
    const menuItems = document.querySelectorAll('.menu-item');
    const breadcrumbLabel = document.getElementById('current-section-name');

    if (scrollArea && sections.length > 0) {
      scrollArea.addEventListener('scroll', () => {
        let currentSectionId = '';
        sections.forEach(section => {
          const sectionTop = section.offsetTop - scrollArea.offsetTop - 100;
          if (scrollArea.scrollTop >= sectionTop) {
            currentSectionId = section.getAttribute('id');
          }
        });

        if (currentSectionId) {
          menuItems.forEach(item => {
            item.classList.remove('active');
            const onclickAttr = item.getAttribute('onclick');
            if (onclickAttr && onclickAttr.includes(currentSectionId)) {
              item.classList.add('active');
              const label = item.querySelector('.menu-label');
              if (label && breadcrumbLabel) {
                breadcrumbLabel.innerText = label.innerText.toUpperCase();
              }
            }
          });
        }
      });
    }
  </script>
</body>
</html>
